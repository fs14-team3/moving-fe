name: API types

# Regenerates src/lib/api-schema.d.ts from the moving-be develop spec and keeps
# one pull request open while they differ. The PR closes itself once they match.
# Run it from the Actions tab after backend spec changes are merged.
# Needs a GitHub App installed on this repository with Contents and Pull requests
# write access: its client ID in the API_TYPES_APP_CLIENT_ID variable and its
# private key in the API_TYPES_APP_PRIVATE_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync API types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate API types from the backend spec
        run: npm run api:types
      # Pull requests opened with GITHUB_TOKEN start no workflows, so required checks would never report.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.API_TYPES_APP_CLIENT_ID }}
          private-key: ${{ secrets.API_TYPES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/api-types-sync
          base: develop
          add-paths: src/lib/api-schema.d.ts
          commit-message: 'chore(api): 백엔드 명세로 API 타입 갱신'
          title: 'chore(api): 백엔드 명세로 API 타입 갱신'
          delete-branch: true
          body: |
            ## 변경점

            moving-be `develop`의 `docs/api/openapi.ko.yaml`로 `src/lib/api-schema.d.ts`를 다시 생성했습니다.

            ## 이유

            백엔드 API 명세가 바뀌었습니다. 이 PR은 [API types 워크플로](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})가 열었고, 명세가 바뀔 때마다 같은 PR을 갱신합니다. 명세와 다시 같아지면 자동으로 닫힙니다.

            ## 테스트 방법

            1. CI가 통과하는지 확인합니다. 실패하면 바뀐 타입에 맞게 이 브랜치에서 코드를 고쳐 주세요.
            2. 로컬에서는 `npm run api:types`로 같은 결과를 만들 수 있습니다.
